    } catch (e) {
      db = null;
    }
    if (!db) {
      S.dbOk = false;
      render();
      return;
    }
    S.dbOk = true;
    try {
      user = await window.claude.use("user");
      if (user) {
        S.uid = await user.id();
        try {
          const c = await user.can("data.write");
          S.canWrite = c !== false;
        } catch (e) {
        }
        try {
          const n = await user.name();
          if (n) $("#who").textContent = "· " + n;
        } catch (e) {
        }
      }
    } catch (e) {
    }
    if (window.__cbLocal) $("#who").textContent = window.__CB_DEMO ? "· versión de prueba" : "· modo local en esta compu";
    {
      const M = window.__CB_DEMO ? ["#B8720E", "Demo para testers", "datos inventados · se puede romper todo", "Demo"] : window.__cbLocal ? ["#2E7D4F", "Mi versión · en esta compu", "tus datos reales, guardados en este Chrome", "Mi compu"] : ["#6450A8", "Versión de claude.ai", "datos de prueba guardados en tu cuenta de Claude", "claude.ai"];
      const el = $("#modo");
      el.style.background = M[0];
      el.innerHTML = `${M[1]} <small>· ${M[2]}</small>`;
      el.hidden = false;
      document.title = "Control de Barriles · " + M[3];
    }
    COLS.forEach((col) => db.collection(col).onSnapshot((s) => {
      S[col] = s.docs.map((d) => ({ id: d.id, ...d.data() }));
      S.got.add(col);
      if ($("#sheet").hidden) render();
      else {
        renderTabs();
        renderQuiet();
      }
    }, (e) => {
      console.warn(col, e);
      S.got.add(col);
      render();
    }));
    db.doc("config/general").onSnapshot((s) => {
      if (s.exists) S.config = { ...S.config, ...s.data() };
      if ($("#sheet").hidden) render();
      else renderQuiet();
    }, () => {
    });
  }
  boot();
})();
</script>

</body>
</html>
